[project]
name = "fitness-content-agent"
version = "0.1.0"
description = "Multi-agent research and script pipeline for a running + strength YouTube channel"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk",
    "pydantic>=2",
    "python-dotenv",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
